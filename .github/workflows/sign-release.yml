name: Sign and list a release

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: Plugin id, e.g. acme.kv
        required: true
      version:
        description: Version being listed, e.g. 1.2.0
        required: true
      engines_app:
        description: Soshi Bench version range this build supports, e.g. ">=0.1.0"
        required: true
        default: ">=0.0.1"
      plugin_api:
        description: Plugin API level the build targets
        required: true
        default: "1"
      artifacts:
        description: Space-separated <platform>=<url> pairs
        required: true
      display_name:
        description: Display name (new listings only)
        required: false
      description:
        description: One-line description (new listings only)
        required: false
      publisher:
        description: Publisher (new listings only)
        required: false
      homepage:
        description: Homepage URL (optional)
        required: false
      target:
        description: Index to list the release in
        required: true
        type: choice
        options:
          - registry.json
          - staging.json
        default: registry.json

permissions:
  contents: write
  pull-requests: write

env:
  PLUGIN_ID: ${{ inputs.plugin_id }}
  VERSION: ${{ inputs.version }}
  ENGINES_APP: ${{ inputs.engines_app }}
  PLUGIN_API: ${{ inputs.plugin_api }}
  ARTIFACTS: ${{ inputs.artifacts }}
  DISPLAY_NAME: ${{ inputs.display_name }}
  DESCRIPTION: ${{ inputs.description }}
  PUBLISHER: ${{ inputs.publisher }}
  HOMEPAGE: ${{ inputs.homepage }}
  TARGET: ${{ inputs.target }}

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - run: bun install --frozen-lockfile

      - name: Restore the signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/registry.key"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/registry.key"

      - name: Sign the artifacts and update the index
        env:
          MINISIGN_SECRET_KEY_FILE: ${{ runner.temp }}/registry.key
          MINISIGN_SECRET_KEY_PASSWORD: ${{ secrets.MINISIGN_SECRET_KEY_PASSWORD }}
        run: |
          args=()
          read -ra pairs <<< "$ARTIFACTS"
          for pair in "${pairs[@]}"; do
            args+=(--artifact "$pair")
          done
          if [ -n "$DISPLAY_NAME" ]; then args+=(--display-name "$DISPLAY_NAME"); fi
          if [ -n "$DESCRIPTION" ]; then args+=(--description "$DESCRIPTION"); fi
          if [ -n "$PUBLISHER" ]; then args+=(--publisher "$PUBLISHER"); fi
          if [ -n "$HOMEPAGE" ]; then args+=(--homepage "$HOMEPAGE"); fi
          bun scripts/add-listing.ts \
            --id "$PLUGIN_ID" \
            --version "$VERSION" \
            --engines-app "$ENGINES_APP" \
            --plugin-api "$PLUGIN_API" \
            --index "$TARGET" \
            "${args[@]}"

      - name: Remove the signing key
        if: always()
        run: shred -u "$RUNNER_TEMP/registry.key" || rm -f "$RUNNER_TEMP/registry.key"

      - name: Check the updated index
        run: bun scripts/validate.ts --index "$TARGET"

      - name: Open the index-update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="list/$PLUGIN_ID-$VERSION-${TARGET%.json}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$TARGET"
          git commit -m "List $PLUGIN_ID@$VERSION in $TARGET"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --title "List $PLUGIN_ID@$VERSION in $TARGET" \
            --body "Signed by the release workflow. Validation runs on this PR."
